# Default values for umami standalone Helm chart.
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: ghcr.io/umami-software/umami
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "postgresql-v2.14.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

commonLabels: {}
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account (e.g. for AWS IRSA: eks.amazonaws.com/role-arn)
  annotations: {}
  # The name of the service account to use.
  name: ""

# Database Configuration (External PostgreSQL, Amazon RDS, Aurora, or Cloud SQL)
database:
  # If existingSecret is set, Helm will NOT create a secret and will reference this secret name
  existingSecret: ""
  secretKeys:
    databaseUrl: "DATABASE_URL"
    appSecret: "APP_SECRET"

  # If existingSecret is empty and awsSecretsManager.enabled is false, these values will be put into a generated K8s Secret:
  url: "postgresql://umami:change_me_in_production@rds-postgres-endpoint.rds.amazonaws.com:5432/umami?sslmode=require&connection_limit=5"
  # Salt string for hashing metrics, minimum 32 characters
  appSecret: "replace-with-a-random-secret-salt-minimum-32-chars-long"

# AWS Secrets Store CSI Driver integration (Optional, recommended for AWS EKS)
awsSecretsManager:
  enabled: false
  # AWS Secret name in AWS Secrets Manager (e.g. vpbank/production/umami)
  awsSecretName: "vpbank/production/umami"
  # Name of SecretProviderClass
  secretProviderClassName: "umami-aws-secrets"
  # K8s secret generated by CSI Driver
  k8sSecretName: "umami-db-secret"
  region: "ap-southeast-1"
  jmesPath:
    databaseUrlKey: "DATABASE_URL"
    appSecretKey: "APP_SECRET"

# Application Environment Variables
env:
  DATABASE_TYPE: "postgresql"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  # Essential behind AWS ALB / Ingress to accurately detect visitor IP and Geo location
  CLIENT_IP_HEADER: "x-forwarded-for"
  DISABLE_TELEMETRY: "1"
  # Custom script name and endpoint to bypass Ad-Blockers (optional)
  TRACKER_SCRIPT_NAME: "telemetry.js"
  COLLECT_API_ENDPOINT: "api/telemetry"
  # Set to "1" if login should be disabled on dashboard
  DISABLE_LOGIN: "0"

# Additional raw environment variables
extraEnv: []
# - name: LOG_LEVEL
#   value: "info"

# Additional environment variables from Secret or ConfigMap
extraEnvFrom: []

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: true
  className: "alb" # "alb" for AWS Load Balancer Controller, "nginx" for ingress-nginx
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing # Use 'internal' for private corporate VPN/intranet
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/heartbeat
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    # AWS ACM Certificate ARN (replace with your domain certificate)
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:123456789012:certificate/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  hosts:
    - host: analytics.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: umami-tls-secret
  #   hosts:
  #     - analytics.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget for high availability during node drain/upgrades
podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  liveness:
    httpGet:
      path: /api/heartbeat
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet:
      path: /api/heartbeat
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 2

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - umami
          topologyKey: topology.kubernetes.io/zone
